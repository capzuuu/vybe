<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/vybe-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>Vybe — Stream Movies &amp; TV Shows</title>
  <meta name="description"
    content="Vybe is your premier entertainment platform. Stream trending movies, TV series, curated watchlists, and connect with fellow cinephiles in real time." />
  <meta name="keywords"
    content="movies, streaming, tv shows, watch online, vybe, cinema, films, community, watchlists" />
  <meta name="theme-color" content="#141414" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Vybe" />
  <meta property="og:title" content="Vybe — Stream Movies &amp; TV Shows" />
  <meta property="og:description"
    content="Stream high-definition movies, binge TV series, and explore curated community watchlists on Vybe." />
  <meta property="og:image" content="/vybe-logo.png" />

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Vybe — Stream Movies &amp; TV Shows" />
  <meta name="twitter:description"
    content="Stream high-definition movies, binge TV series, and explore curated community watchlists on Vybe." />
  <meta name="twitter:image" content="/vybe-logo.png" />

  <!-- Performance: Preconnect & DNS-Prefetch for Speed -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
  <link rel="dns-prefetch" href="https://image.tmdb.org">
  <link rel="preconnect" href="https://api.themoviedb.org" crossorigin>
  <link rel="dns-prefetch" href="https://api.themoviedb.org">
  <link rel="preconnect" href="https://vidlink.pro" crossorigin>
  <link rel="dns-prefetch" href="https://vidlink.pro">

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7903107896302712"
    crossorigin="anonymous"></script>

  <!-- Fonts (loaded non-blocking via main.tsx; noscript fallback) -->
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Cinzel:wght@700&family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@800&family=Permanent+Marker&family=Playfair+Display:ital,wght@1,900&family=Righteous&display=swap"
      rel="stylesheet"
    />
  </noscript>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
